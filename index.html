<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>StockSwipe – Clean Luxury</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar" aria-label="App Kopfzeile">
      <div class="brand">
        <div class="brand-badge" aria-hidden="true"><span>SS</span></div>
        <div class="brand-title">
          <strong>StockSwipe</strong>
          <small id="pageSubtitle">Swipe dich durch Aktien</small>
        </div>
      </div>

      <button id="watchlistBtn" class="watchlist-btn" aria-label="Watchlist öffnen">
        <span aria-hidden="true">★</span>
        <span id="watchlistBadge" class="watchlist-badge" style="display:none;">0</span>
      </button>
    </header>

    <section id="pageSwipe" class="page active" aria-label="Swipe Seite">
      <main class="deck" aria-label="Kartenstapel">
        <div id="card" class="card" role="article" aria-label="Aktienkarte">
          <div class="card-inner">

            <!-- Hintergrundfoto -->
            <div class="card-bg" id="cardBg"></div>

            <!-- Gradient-Overlay mit Inhalten -->
            <div class="card-overlay" aria-hidden="true">
              <div class="stamp like" id="stampLike">LIKE</div>
              <div class="stamp nope" id="stampNope">NOPE</div>
              <div class="stamp super" id="stampSuper">SUPER</div>

              <!-- Oben: Logo + Flagge -->
              <div class="card-top">
                <div id="logo" class="logo">AP</div>
                <span id="countryFlag" class="country-flag">🇺🇸</span>
              </div>

              <!-- Unten: Name, Fakten, Trend -->
              <div class="card-bottom">
                <div class="name-ticker-row">
                  <h2 id="companyName">Apple Inc.</h2>
                  <span id="ticker" class="ticker">AAPL</span>
                </div>
                <div class="card-facts-row">
                  <div id="dividendInfo" class="dividend-info"></div>
                  <span id="sectorBadge" class="sector-badge">Technologie</span>
                </div>
                <div id="trendStamp" class="trend-stamp"></div>
              </div>
            </div>

            <!-- Detail-Sheet (hochwischen) -->
            <div id="sheet" class="sheet" aria-label="Unternehmensdetails">
              <div class="sheet-content">
                <div class="sheet-handle-area" id="sheetHandle">
                  <div class="sheet-handle" aria-hidden="true"></div>
                </div>
                <div class="sheet-title">
                  <h3 id="sheetTitle">Apple Inc.</h3>
                  <button id="closeSheetBtn" type="button">✕</button>
                </div>

                <!-- Kennzahlen -->
                <div class="numbers" aria-label="Kennzahlen">
                  <div class="pill">
                    <small>Aktueller Kurs</small>
                    <strong id="price">–</strong>
                  </div>
                  <div class="pill">
                    <small>Market Cap</small>
                    <strong id="mcap">–</strong>
                  </div>
                  <div class="pill" style="grid-column: 1 / -1;">
                    <small>Wertentwicklung</small>
                    <div class="trend">
                      <span class="trend-chip">1W <b id="perfW">–</b></span>
                      <span class="trend-chip">1M <b id="perfM">–</b></span>
                      <span class="trend-chip">1Y <b id="perfY">–</b></span>
                    </div>
                  </div>
                </div>

                <!-- Produkte -->
                <div class="sheet-section">
                  <span class="section-label">Produkte</span>
                  <div id="productList" class="brand-row"></div>
                </div>

                <!-- Wettbewerber -->
                <div class="sheet-section">
                  <span class="section-label">Wettbewerber</span>
                  <div id="competitorList" class="brand-row"></div>
                </div>

                <p id="description" class="desc">–</p>

                <div class="meta" aria-label="Weitere Werte">
                  <div class="pill">
                    <small>Branche</small>
                    <strong id="sector">–</strong>
                  </div>
                  <div class="pill">
                    <small>Land</small>
                    <strong id="country">–</strong>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <nav class="controls" aria-label="Aktionen">
        <button id="btnNope" class="btn nope" type="button" aria-label="Dislike">
          <span class="dot nope" aria-hidden="true"></span>
        </button>
        <button id="btnSuper" class="btn super" type="button" aria-label="Superlike">
          <span class="dot super" aria-hidden="true">★</span>
        </button>
        <button id="btnLike" class="btn like" type="button" aria-label="Like">
          <span class="dot like" aria-hidden="true"></span>
        </button>
      </nav>
    </section>

    <section id="pageEtf" class="page" aria-label="ETF Seite">
      <div class="panel">
        <h3>Eigenen ETF erstellen</h3>
        <div class="row" style="margin-bottom:10px;">
          <input id="etfName" class="input" placeholder="ETF-Name (z. B. Tech Giants)" />
        </div>
        <div class="row" style="margin-bottom:4px;">
          <input id="assetInput" class="input" placeholder="Ticker (z. B. AAPL)" style="flex:2;" />
          <input id="weightInput" class="input weight-input" placeholder="%" type="number" min="1" max="100" />
          <button id="addAssetBtn" class="smallbtn">+</button>
        </div>
        <div id="assetTags"></div>
        <div id="weightSum" class="weight-sum"></div>
        <div class="row" style="margin-top:12px;">
          <button id="saveEtfBtn" class="smallbtn" style="flex:1;">Speichern</button>
          <button id="resetEtfBtn" class="smallbtn reset-btn" style="flex:1;">Reset</button>
        </div>
      </div>

      <div class="panel">
        <div class="lb-header">
          <h3>Leaderboard — Top 10</h3>
          <div class="lb-filter" role="group" aria-label="Zeitraum">
            <button class="lb-filter-btn active" data-period="d">Heute</button>
            <button class="lb-filter-btn" data-period="w">1W</button>
            <button class="lb-filter-btn" data-period="m">1M</button>
            <button class="lb-filter-btn" data-period="y">1J</button>
          </div>
        </div>
        <div id="leaderboard" class="list" aria-label="Leaderboard"></div>
      </div>
    </section>
  </div>

  <aside id="watchlist" class="watchlist" aria-label="Watchlist Popup">
    <div class="watchlist-head">
      <strong>Deine Watchlist</strong>
      <button id="watchlistClose" type="button">✕</button>
    </div>
    <div id="watchlistList" class="watchlist-list"></div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="bottom-nav" aria-label="Taskleiste">
    <button id="tabSwipe" class="tab active" type="button" aria-label="Swipe">Swipe</button>
    <button id="tabEtf" class="tab" type="button" aria-label="ETF Builder">ETF</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
