# Cloudflare-Worker für das KI-Backend
name = "stockswipe-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Variablen, die du im Cloudflare-Dashboard änderst (z. B. den KI-Schalter),
# werden beim nächsten Deploy NICHT überschrieben.
keep_vars = true

# ── Einstellungen ────────────────────────────────────────────
# Die folgenden Werte änderst du im Cloudflare-Dashboard unter
# Settings → Variables and Secrets. Sie stehen hier bewusst NICHT als [vars],
# damit ein neues Deploy deine Einstellungen nie überschreibt.
# Fehlt eine Variable, gilt der Standardwert in Klammern:
#
#   AI_ENABLED            DER SCHALTER: "true" = KI an  (Standard: aus)
#   DAILY_BUDGET_EUR      max. KI-Kosten pro Tag in Euro   (5)
#   USD_PER_EUR           Umrechnungskurs                  (1.15)
#   RATE_LIMIT_PER_HOUR   neue KI-Anfragen pro Gerät/Std.  (30)
#   LOGO_LIMIT_PER_HOUR   neue Logo-Abrufe pro Gerät/Std.  (150)
#   MODEL_DIVE / MODEL_CARD / MODEL_SEARCH                 (claude-sonnet-5-5 / claude-haiku-5-5 / claude-haiku-5-5)
#   TTL_SUPPLY_DAYS / TTL_CARD_DAYS / TTL_DIVIDEND_DAYS    (90 / 180 / 90)
#   MIN_MARKET_CAP_USD    Mindestgröße für die Suche       (50000000)
#   EVIDENCE_MAX_AGE_YEARS  max. Alter der Belege          (4)

[vars]
# Kennung, die nur die eigene App mitschickt (steht auch in config.js).
# Kein Geheimnis – hält nur Gelegenheitsnutzer und Scanner fern.
APP_KEY = "sw-be4fe0029d6db9cfd8688ded"

[[d1_databases]]
binding = "DB"
database_name = "stockswipe"
database_id = "517ecac9-906c-46fb-be68-a1594a4db4f9"

# Geheimnisse (NICHT hier eintragen, sondern per Befehl bzw. im Dashboard):
#   ANTHROPIC_API_KEY  → npx wrangler secret put ANTHROPIC_API_KEY
#   ADMIN_TOKEN        → npx wrangler secret put ADMIN_TOKEN   (optional, zum Löschen einzelner Archiv-Einträge)
#   IP_SALT            → beliebiger Zufallstext (optional, macht die IP-Hashes noch sicherer)
